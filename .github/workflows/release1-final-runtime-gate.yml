name: Release 1 final runtime gate

on:
  push:
    branches:
      - agent/release1-runtime-gate-20260827
    paths-ignore:
      - 'runtime-gate-final-output/**'

permissions:
  contents: write

concurrency:
  group: release1-final-runtime-gate
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/release1-runtime-gate-20260827
  OUT: runtime-gate-final-output

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: curl, dom, json, libxml, mbstring, mysqli, tokenizer, xml, xmlwriter, zip

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Apply reviewed runtime repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/evidence"
          python3 runtime-gate/apply-final-runtime-repairs.py | tee "$OUT/evidence/repair.log"
          git diff --check | tee "$OUT/evidence/git-diff-check.log"
          git diff --stat | tee "$OUT/evidence/git-diff-stat.log"

      - name: Execute static and contract gates
        id: static
        shell: bash
        run: |
          set +e
          result=0
          record(){ printf '%s=%s\n' "$1" "$2" | tee -a "$OUT/evidence/gates.env"; [ "$2" = 0 ] || result=1; }

          test -f src/Release1Runtime/Runtime.php; record release1_runtime_present $?
          grep -q 'Runtime::preBoot' yassin-ai-assistant.php; record migration_before_core_authority $?
          grep -q 'YSAI_PLUGIN_FILE' yassin-ai-assistant.php; record legacy_public_constants_preserved $?
          grep -q 'before_woocommerce_init' yassin-ai-assistant.php; record hpos_declaration_preserved $?
          grep -q 'RENAME TABLE' src/Release1Runtime/Runtime.php; record atomic_legacy_namespace_migration $?
          grep -q 'GET_LOCK' src/Release1Runtime/Runtime.php; record migration_lock_present $?
          grep -q 'state_hash' src/Release1Runtime/Runtime.php; record structured_event_state_hash_present $?
          grep -q 'confirmation_record_required' src/Release1Runtime/Runtime.php; record sensitive_short_reply_fail_closed $?
          grep -q "'chat_checkout'.*'off\|'chat_checkout','order_service'" src/Release1Runtime/Runtime.php; record future_features_default_off $?

          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > "$OUT/evidence/php-lint.log" 2>&1; record php_tree_lint $?
          find assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file" || exit 1; done > "$OUT/evidence/javascript-syntax.log" 2>&1; record javascript_syntax $?

          if grep -R --include='*.php' -E 'WC_Cart::|->add_to_cart\(|->remove_cart_item\(|->set_quantity\(|->empty_cart\(|wc_create_order\(|payment_complete\(|set_status\(' src/Release1Runtime 2>/dev/null; then
            record release1_no_direct_commerce_mutation 1
          else
            record release1_no_direct_commerce_mutation 0
          fi

          if grep -R --include='*.php' --exclude='Runtime.php' 'ysai_r1_' src 2>/dev/null; then
            record no_active_legacy_release1_namespace 1
          else
            record no_active_legacy_release1_namespace 0
          fi

          python3 - <<'PY' > "$OUT/evidence/schema-contract.log" 2>&1
          from pathlib import Path
          text=Path('src/Release1Runtime/Runtime.php').read_text()
          required=['focus','pending_questions','journeys','sales_context','interaction_events','agent_policy_versions','knowledge_sources','audit']
          missing=[x for x in required if "self::table('"+x+"')" not in text]
          if missing: raise SystemExit('missing tables: '+','.join(missing))
          if 'DROP TABLE' in text.upper(): raise SystemExit('destructive schema statement found')
          print('additive schema contract passed')
          PY
          record additive_schema_contract $?

          exit "$result"

      - name: Prepare WordPress runtime images
        id: images
        if: always()
        shell: bash
        run: |
          set +e
          result=0
          record(){ printf '%s=%s\n' "$1" "$2" | tee -a "$OUT/evidence/gates.env"; [ "$2" = 0 ] || result=1; }
          docker version > "$OUT/evidence/docker-version.log" 2>&1; record docker_available $?
          docker compose version > "$OUT/evidence/docker-compose-version.log" 2>&1; record docker_compose_available $?
          test -f integration/docker-compose.yml; record integration_compose_present $?
          if [ -f integration/docker-compose.yml ]; then
            sed -i -E 's#wordpress:6\.9[^[:space:]]*-apache#wordpress:6.9.7-php8.3-apache#g' integration/docker-compose.yml
            sed -i -E 's#wordpress:cli-[^[:space:]]+#wordpress:cli-2.12.0-php8.3#g' integration/docker-compose.yml
          fi
          exit "$result"

      - name: Fresh activation migration privacy retention and rollback
        id: release1_runtime
        if: always()
        shell: bash
        run: |
          set +e
          chmod +x integration/scripts/release1-runtime.sh 2>/dev/null
          timeout 40m ./integration/scripts/release1-runtime.sh > "$OUT/evidence/release1-runtime.log" 2>&1
          status=$?
          printf 'release1_activation_migration_privacy_retention_rollback=%s\n' "$status" | tee -a "$OUT/evidence/gates.env"
          [ -d integration/artifacts/release1 ] && cp -a integration/artifacts/release1 "$OUT/evidence/release1-artifacts"
          exit 0

      - name: WooCommerce 11.0.1 activation and bootstrap lane
        id: current_wc
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$OUT/evidence/woocommerce-11-runtime.log"
          COMPOSE='docker compose -f integration/docker-compose.yml'
          status=0
          {
            $COMPOSE down -v --remove-orphans || true
            $COMPOSE up -d db fake-gemini wordpress
            for attempt in $(seq 1 90); do
              if $COMPOSE run --rm wpcli core is-installed --allow-root >/dev/null 2>&1; then break; fi
              $COMPOSE run --rm wpcli core install --url=http://localhost:8080 --title='YSAI WC 11 Runtime' --admin_user=admin --admin_password='runtime-admin-password' --admin_email=runtime@example.test --skip-email --allow-root && break
              sleep 2
            done
            $COMPOSE run --rm wpcli plugin install woocommerce --version=11.0.1 --activate --force --allow-root
            $COMPOSE run --rm wpcli plugin activate yassin-ai-assistant --allow-root
            $COMPOSE run --rm wpcli eval '
              if (!defined("WC_VERSION") || version_compare(WC_VERSION,"11.0.1","<")) { throw new RuntimeException("WooCommerce 11.0.1 did not boot."); }
              if (!class_exists("YassinStore\\AiAssistant\\Plugin")) { throw new RuntimeException("Core plugin class did not load."); }
              if (!class_exists("YassinStore\\AiAssistant\\Release1Runtime\\Runtime")) { throw new RuntimeException("Release 1 runtime class did not load."); }
              global $wpdb;
              foreach (["focus","pending_questions","journeys","sales_context","interaction_events","agent_policy_versions","knowledge_sources","audit"] as $suffix) {
                $table=$wpdb->prefix."ysr1_".$suffix;
                if ($wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s",$wpdb->esc_like($table))) !== $table) { throw new RuntimeException("Missing ".$table); }
              }
              echo "WooCommerce current-stable activation passed\n";
            ' --allow-root
            $COMPOSE run --rm wpcli option get ysai_release1_runtime_schema --allow-root
            curl --fail --retry 10 --retry-delay 2 http://localhost:8080/wp-json/ >/dev/null
            $COMPOSE run --rm wpcli plugin deactivate yassin-ai-assistant --allow-root
            $COMPOSE run --rm wpcli plugin activate yassin-ai-assistant --allow-root
          } > "$LOG" 2>&1 || status=$?
          $COMPOSE down -v --remove-orphans >> "$LOG" 2>&1 || true
          printf 'woocommerce_11_0_1_activation_bootstrap=%s\n' "$status" | tee -a "$OUT/evidence/gates.env"
          exit 0

      - name: Structured-event concurrency and actor isolation probe
        id: concurrency
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$OUT/evidence/concurrency-actor-isolation.log"
          COMPOSE='docker compose -f integration/docker-compose.yml'
          status=0
          {
            $COMPOSE down -v --remove-orphans || true
            $COMPOSE up -d db wordpress
            for attempt in $(seq 1 90); do
              if $COMPOSE run --rm wpcli core is-installed --allow-root >/dev/null 2>&1; then break; fi
              $COMPOSE run --rm wpcli core install --url=http://localhost:8080 --title='YSAI Concurrency Runtime' --admin_user=admin --admin_password='runtime-admin-password' --admin_email=runtime@example.test --skip-email --allow-root && break
              sleep 2
            done
            $COMPOSE run --rm wpcli plugin install woocommerce --version=10.9.4 --activate --force --allow-root
            $COMPOSE run --rm wpcli plugin activate yassin-ai-assistant --allow-root
            $COMPOSE run --rm wpcli eval '
              global $wpdb;
              $table=$wpdb->prefix."ysr1_interaction_events";
              $token="runtime-concurrency-token";
              $wpdb->insert($table,["event_id"=>wp_generate_uuid4(),"token_hash"=>hash("sha256",$token),"site_id"=>get_current_blog_id(),"actor_key"=>"g:1:actor-a","conversation_key"=>"conversation-a","event_type"=>"answer_pending_question","state_hash"=>hash("sha256","q|1"),"payload_json"=>"{}","status"=>"issued","expires_at"=>gmdate("Y-m-d H:i:s",time()+3600),"created_at"=>gmdate("Y-m-d H:i:s")]);
              if ($wpdb->last_error) { throw new RuntimeException($wpdb->last_error); }
              echo $token;
            ' --allow-root > /tmp/ysai-event-token.txt
            cat > /tmp/reserve.php <<'PHP'
<?php
global $wpdb;
$table=$wpdb->prefix.'ysr1_interaction_events';
$count=$wpdb->query($wpdb->prepare("UPDATE `$table` SET status='reserved',reserved_turn=%s WHERE token_hash=%s AND status='issued'",wp_generate_uuid4(),hash('sha256','runtime-concurrency-token')));
echo (string)$count;
PHP
            ($COMPOSE run --rm wpcli eval-file /tmp/reserve.php --allow-root > /tmp/reserve-a.txt) & a=$!
            ($COMPOSE run --rm wpcli eval-file /tmp/reserve.php --allow-root > /tmp/reserve-b.txt) & b=$!
            wait $a; wait $b
            combined="$(cat /tmp/reserve-a.txt)$(cat /tmp/reserve-b.txt)"
            test "$combined" = '10' -o "$combined" = '01'
            $COMPOSE run --rm wpcli eval '
              $reflection=new ReflectionClass("YassinStore\\AiAssistant\\Release1Runtime\\Runtime");
              $method=$reflection->getMethod("resolveActor"); $method->setAccessible(true);
              $a=new WP_REST_Request("POST","/ysai/v1/chat"); $a->set_header("X-YSAI-Session","stable-session");
              $b=new WP_REST_Request("POST","/ysai/v1/chat"); $b->set_header("X-YSAI-Session","stable-session");
              $c=new WP_REST_Request("POST","/ysai/v1/chat"); $c->set_header("X-YSAI-Session","other-session");
              $aa=$method->invoke(null,$a); $bb=$method->invoke(null,$b); $cc=$method->invoke(null,$c);
              if (!hash_equals($aa["key"],$bb["key"]) || hash_equals($aa["key"],$cc["key"])) { throw new RuntimeException("Actor isolation failed."); }
              echo "actor isolation passed\n";
            ' --allow-root
          } > "$LOG" 2>&1 || status=$?
          $COMPOSE down -v --remove-orphans >> "$LOG" 2>&1 || true
          printf 'structured_event_concurrency_actor_isolation=%s\n' "$status" | tee -a "$OUT/evidence/gates.env"
          exit 0

      - name: Existing chat fake-Gemini cart and browser runtime suite
        id: full_runtime
        if: always()
        shell: bash
        run: |
          set +e
          python3 integration/scripts/verify-source.py > "$OUT/evidence/integration-source-contract.log" 2>&1
          source_status=$?
          node integration/fake-gemini/self-test.js > "$OUT/evidence/fake-gemini-self-test.log" 2>&1
          fake_status=$?
          python3 integration/promotion/scripts/self-test.py > "$OUT/evidence/promotion-self-test.log" 2>&1
          promotion_status=$?
          timeout 60m ./integration/scripts/run.sh > "$OUT/evidence/full-chat-cart-browser-runtime.log" 2>&1
          runtime_status=$?
          printf 'integration_source_contract=%s\n' "$source_status" | tee -a "$OUT/evidence/gates.env"
          printf 'fake_gemini_protocol=%s\n' "$fake_status" | tee -a "$OUT/evidence/gates.env"
          printf 'promotion_harness_self_test=%s\n' "$promotion_status" | tee -a "$OUT/evidence/gates.env"
          printf 'full_chat_cart_browser_runtime=%s\n' "$runtime_status" | tee -a "$OUT/evidence/gates.env"
          [ -d integration/artifacts ] && cp -a integration/artifacts "$OUT/evidence/all-integration-artifacts"
          exit 0

      - name: Evaluate gates and package only on complete pass
        if: always()
        shell: bash
        env:
          GEMINI_SECRET_PRESENT: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, shutil, subprocess, zipfile

          root=pathlib.Path('.')
          out=pathlib.Path(os.environ['OUT'])
          evidence=out/'evidence'
          gates={}
          gate_file=evidence/'gates.env'
          if gate_file.exists():
              for line in gate_file.read_text(errors='replace').splitlines():
                  if '=' not in line: continue
                  key,value=line.split('=',1)
                  try: gates[key]=int(value)
                  except ValueError: gates[key]=999
          required=[
              'release1_runtime_present','migration_before_core_authority','legacy_public_constants_preserved','hpos_declaration_preserved',
              'atomic_legacy_namespace_migration','migration_lock_present','structured_event_state_hash_present','sensitive_short_reply_fail_closed',
              'future_features_default_off','php_tree_lint','javascript_syntax','release1_no_direct_commerce_mutation',
              'no_active_legacy_release1_namespace','additive_schema_contract','docker_available','docker_compose_available','integration_compose_present',
              'release1_activation_migration_privacy_retention_rollback','woocommerce_11_0_1_activation_bootstrap',
              'structured_event_concurrency_actor_isolation','integration_source_contract','fake_gemini_protocol','promotion_harness_self_test',
              'full_chat_cart_browser_runtime'
          ]
          missing=[key for key in required if key not in gates]
          failed={key:gates.get(key,999) for key in required if gates.get(key,999)!=0}
          ok=not missing and not failed
          report={
              'ok':ok,
              'classification':'runtime_verified' if ok else 'blocked',
              'required_gates':{key:gates.get(key) for key in required},
              'missing_gates':missing,
              'failed_gates':failed,
              'wordpress_runtime':'6.9.7',
              'woocommerce_runtime_matrix':['10.9.4','11.0.1'],
              'php_runtime':'8.3',
              'node_runtime':'24.18.0',
              'real_gemini_secret_present':os.environ.get('GEMINI_SECRET_PRESENT','false').lower()=='true',
              'real_gemini_live_call_executed':False,
              'limitations':[
                  'The repository had no usable real Gemini secret for this workflow; provider behavior was validated with the deterministic fake-Gemini protocol unless real_gemini_secret_present is true.',
                  'The browser lane uses the repository integration storefront rather than the live store theme and production database.'
              ],
          }
          exclusions={'.git','.github','integration','tests','test-results','playwright-report','release','runtime-gate','runtime-gate-output','runtime-gate-v2-output','runtime-gate-final-output'}
          artifacts=[]
          if ok:
              installable=out/'ysai-release1-runtime-verified.zip'
              source=out/'ysai-release1-runtime-verified-source.zip'
              for target,is_source in [(installable,False),(source,True)]:
                  with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
                      for path in sorted(root.rglob('*')):
                          if not path.is_file() or '.git' in path.parts or out.name in path.parts: continue
                          rel=path.relative_to(root)
                          if not is_source and rel.parts and rel.parts[0] in exclusions: continue
                          archive.write(path,pathlib.Path('yassin-ai-assistant')/rel)
                  artifacts.append(target)
          def digest(path:pathlib.Path)->str:
              h=hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda:fh.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          report['artifacts']={p.name:{'bytes':p.stat().st_size,'sha256':digest(p)} for p in artifacts}
          (out/'runtime-gate-result.json').write_text(json.dumps(report,indent=2)+'\n')
          lines=['# Release 1 final runtime verdict','',f"**Verdict:** {'PASS — runtime verified' if ok else 'BLOCKED'}",'']
          if failed:
              lines += ['## Failed gates','']+[f"- `{key}`: exit {value}" for key,value in failed.items()]+['']
          if missing:
              lines += ['## Missing gates','']+[f"- `{key}`" for key in missing]+['']
          if ok:
              lines += ['The installable and source packages were created only after every required gate returned zero.','']
          lines += ['## Boundaries','',*['- '+x for x in report['limitations']],'']
          (out/'VERDICT.md').write_text('\n'.join(lines))
          if artifacts:
              (out/'SHA256SUMS.txt').write_text('\n'.join(f"{digest(p)}  {p.name}" for p in artifacts)+'\n')
          with zipfile.ZipFile(out/'release1-runtime-evidence.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in sorted(evidence.rglob('*')):
                  if path.is_file(): archive.write(path,path.relative_to(out))
              for name in ['runtime-gate-result.json','VERDICT.md','SHA256SUMS.txt']:
                  path=out/name
                  if path.exists(): archive.write(path,path.relative_to(out))
          PY

          git config user.name 'Release 1 Runtime Gate'
          git config user.email 'runtime-gate@users.noreply.github.com'
          git add -A
          git commit -m 'test: apply and publish final Release 1 runtime gate [skip ci]' || true
          git push origin "HEAD:$TARGET_BRANCH"

          python3 - <<'PY'
          import json,os,pathlib,sys
          result=json.loads((pathlib.Path(os.environ['OUT'])/'runtime-gate-result.json').read_text())
          raise SystemExit(0 if result.get('ok') else 1)
          PY

      - name: Upload runtime evidence and verified packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-final-runtime-gate
          path: runtime-gate-final-output/
          if-no-files-found: error
          retention-days: 30
